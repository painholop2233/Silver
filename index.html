    <script>
      (function() {
        // Intercept console.error to filter out Vite HMR WebSocket connection notices in cloud preview
        const origConsoleError = console.error;
        console.error = function(...args) {
          const text = args.map(a => (a && (a.stack || a.message)) || String(a)).join(' ');
          if (text.includes('WebSocket closed without opened') || (text.includes('WebSocket') && text.includes('vite'))) {
            return;
          }
          return origConsoleError.apply(console, args);
        };

        // Mock WebSocket for 'vite-hmr' subprotocol to prevent socket close failures in cloud preview
        const NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            const isViteHmr = protocols === 'vite-hmr' || (typeof url === 'string' && url.includes('vite-hmr'));
            if (isViteHmr) {
              const target = new EventTarget();
              target.readyState = 1; // OPEN
              target.binaryType = 'blob';
              target.url = String(url);
              target.protocol = 'vite-hmr';
              target.send = function() {};
              target.close = function() {};
              target.onopen = null;
              target.onmessage = null;
              target.onclose = null;
              target.onerror = null;
              return target;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('error', function (e) {
          if (e.message && (e.message.includes('WebSocket') || e.message.includes('vite') || e.message.includes('closed without opened'))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          if (e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('closed without opened'))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
